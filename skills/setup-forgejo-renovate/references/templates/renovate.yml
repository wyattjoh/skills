name: Renovate

on:
  schedule:
    - cron: "__WEEKLY_CRON__"
      timezone: "__TIMEZONE__"
  workflow_dispatch:
  issues:
    types: [edited]
  # Use the trusted base-branch workflow and secrets; never execute PR code.
  pull_request_target:
    types: [edited]
    branches: ["__DEFAULT_BRANCH__"]

permissions: {}

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    # Only the owner can request immediate work. Bot-authored edits must not
    # retrigger Renovate, and unrelated issues/PRs must not consume a runner.
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.actor == '__AUTHORIZED_ACTOR__' && github.event.action == 'edited' &&
        ((github.event_name == 'issues' &&
          github.event.issue.user.login == '__BOT_LOGIN__' &&
          github.event.issue.title == 'Dependency Dashboard' &&
          github.event.issue.state == 'open' &&
          contains(github.event.issue.body, '[x]')) ||
         (github.event_name == 'pull_request_target' &&
          github.event.pull_request.user.login == '__BOT_LOGIN__' &&
          github.event.pull_request.base.ref == '__DEFAULT_BRANCH__' &&
          github.event.pull_request.state == 'open' &&
          contains(github.event.pull_request.body, '[x]'))))
    runs-on: "__RUNNER_LABEL__"
    timeout-minutes: 60
    # Official default image; the digest pins its multi-architecture index.
    container:
      image: ghcr.io/renovatebot/renovate:44.79.2@sha256:9327fbe499d0e01d090480e43e9b35fb6e56a7d4f7e4f806882c56f752da4ad4
    env:
      RENOVATE_PLATFORM: forgejo
      RENOVATE_REPOSITORY: "__REPOSITORY__"
      RENOVATE_ENDPOINT: "__FORGEJO_ORIGIN__/api/v1"
      # The synthetic forgejo-actions identity cannot be Renovate's PR author.
      RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
      # GitHub-hosted Actions and changelogs need public-repository API access.
      RENOVATE_GITHUB_COM_TOKEN: ${{ secrets.RENOVATE_GITHUB_COM_TOKEN }}
      RENOVATE_ONBOARDING: "false"
      RENOVATE_REQUIRE_CONFIG: required
      # Install tools on demand for the repository's detected managers.
      RENOVATE_BINARY_SOURCE: install
      LOG_LEVEL: info
    steps:
      - name: Update this repository
        run: |
          if [ -z "$RENOVATE_TOKEN" ]; then
            echo "Set the RENOVATE_TOKEN Actions secret for the renovate bot." >&2
            exit 1
          fi
          if [ -z "$RENOVATE_GITHUB_COM_TOKEN" ]; then
            echo "Set the RENOVATE_GITHUB_COM_TOKEN Actions secret for public GitHub lookups." >&2
            exit 1
          fi
          renovate --version
          exec renovate "$RENOVATE_REPOSITORY"
