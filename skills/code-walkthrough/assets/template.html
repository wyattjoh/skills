<!doctype html>
<html lang="en" data-catppuccin-flavor="mocha">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{PAGETITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;1,6..72,300&family=Inter:wght@400;450;500;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   LAYER 1 - palette adapter. The only place flavor values live.
   Catppuccin Mocha, canonical labels.
   ============================================================ */
[data-catppuccin-flavor="mocha"]{
  --ctp-base:#1e1e2e;    --ctp-mantle:#181825;  --ctp-crust:#11111b;
  --ctp-surface0:#313244;--ctp-surface1:#45475a;--ctp-surface2:#585b70;
  --ctp-overlay0:#6c7086;--ctp-overlay1:#7f849c;--ctp-overlay2:#9399b2;
  --ctp-subtext0:#a6adc8;--ctp-subtext1:#bac2de;--ctp-text:#cdd6f4;
  --ctp-rosewater:#f5e0dc;--ctp-flamingo:#f2cdcd;--ctp-pink:#f5c2e7;
  --ctp-mauve:#cba6f7;   --ctp-red:#f38ba8;     --ctp-maroon:#eba0ac;
  --ctp-peach:#fab387;   --ctp-yellow:#f9e2af;  --ctp-green:#a6e3a1;
  --ctp-teal:#94e2d5;    --ctp-sky:#89dceb;     --ctp-sapphire:#74c7ec;
  --ctp-blue:#89b4fa;    --ctp-lavender:#b4befe;
}

/* ============================================================
   LAYER 2 - semantic tokens. Components consume only these.
   Every pair below is contrast-asserted in scripts/build.test.ts.
   ============================================================ */
:root{
  --ui-canvas:          var(--ctp-base);
  --ui-canvas-sunken:   var(--ctp-mantle);
  --ui-canvas-deep:     var(--ctp-crust);
  --ui-panel:           var(--ctp-surface0);
  --ui-panel-hover:     var(--ctp-surface1);
  --ui-border:          var(--ctp-surface1);
  --ui-border-quiet:    var(--ctp-surface0);
  --ui-border-strong:   var(--ctp-overlay0);
  --ui-text:            var(--ctp-text);
  --ui-text-secondary:  var(--ctp-subtext1);
  --ui-text-muted:      var(--ctp-subtext0);
  --ui-text-faint:      var(--ctp-overlay2);  /* overlay1 is 4.44:1 on base - one step up clears AA */
  --ui-action:          var(--ctp-mauve);     /* links, active nav, spotlight - never used inside code */
  --ui-focus:           var(--ctp-lavender);
  --ui-info:            var(--ctp-sapphire);
  --ui-success:         var(--ctp-green);
  --ui-caution:         var(--ctp-peach);
  --ui-danger:          var(--ctp-maroon);
  --ui-quiet-accent:    var(--ctp-teal);

  /* syntax - a separate vocabulary, so mauve stays unambiguous as "you are here" */
  --syn-keyword: var(--ctp-pink);
  --syn-type:    var(--ctp-yellow);
  --syn-func:    var(--ctp-blue);
  --syn-string:  var(--ctp-green);
  --syn-number:  var(--ctp-peach);
  --syn-ident:   var(--ctp-teal);
  --syn-comment: var(--ctp-overlay2);
  --syn-punct:   var(--ctp-overlay1);

  --grid-line: color-mix(in srgb, var(--ctp-surface0) 62%, transparent);
  --serif:"Newsreader",Iowan Old Style,Georgia,serif;
  --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;

  --pane-w:52%;
  --gap:clamp(2rem,4vw,4.5rem);
  --pad:clamp(1.5rem,5vw,4rem);
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{
  margin:0;background:var(--ui-canvas);color:var(--ui-text);
  font-family:var(--sans);font-size:15.5px;line-height:1.65;
  -webkit-font-smoothing:antialiased;font-feature-settings:"cv05","ss01";
}
body::before{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:
    linear-gradient(to right,var(--grid-line) 1px,transparent 1px),
    linear-gradient(to bottom,var(--grid-line) 1px,transparent 1px);
  background-size:72px 72px;
  -webkit-mask-image:radial-gradient(ellipse 120% 80% at 50% 0%,#000 0%,transparent 78%);
          mask-image:radial-gradient(ellipse 120% 80% at 50% 0%,#000 0%,transparent 78%);
  opacity:.85;
}
body>*{position:relative;z-index:1}

a{color:var(--ui-action);text-decoration:none;border-bottom:1px solid color-mix(in srgb,var(--ui-action) 35%,transparent)}
a:hover{border-bottom-color:var(--ui-action)}
:focus-visible{outline:2px solid var(--ui-focus);outline-offset:3px;border-radius:3px}
code{font-family:var(--mono);font-size:.855em}

/* ================= masthead ================= */
.mast{max-width:1520px;margin:0 auto;padding:clamp(4rem,10vh,8rem) var(--pad) clamp(3rem,7vh,5rem)}
.mast-inner{max-width:62rem}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ui-action);margin-bottom:1.8rem}
.eyebrow span{color:var(--ui-text-faint)}
h1{font-family:var(--serif);font-weight:300;font-size:clamp(2.7rem,7vw,5.4rem);line-height:1.03;letter-spacing:-.022em;margin:0 0 1.4rem;max-width:19ch;color:var(--ui-text)}
h1 em{font-style:italic;color:var(--ui-action)}
.lede{font-size:clamp(1.02rem,1.4vw,1.2rem);color:var(--ui-text-secondary);max-width:60ch;margin:0 0 3rem;font-weight:400}
.lede strong{color:var(--ui-text);font-weight:500}

.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:1px;background:var(--ui-border-quiet);border:1px solid var(--ui-border-quiet);border-radius:12px;overflow:hidden}
.fact{background:var(--ui-canvas-sunken);padding:1.05rem 1.15rem}
.fact dt{font-family:var(--mono);font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--ui-text-faint);margin-bottom:.45rem}
.fact dd{margin:0;font-family:var(--mono);font-size:12px;color:var(--ui-text-secondary);word-break:break-word;line-height:1.5}

/* ================= full-width bands ================= */
.band{max-width:1520px;margin:0 auto;padding:clamp(2.5rem,6vh,4.5rem) var(--pad)}
.band-inner{max-width:72rem}
.band h2{font-family:var(--serif);font-weight:300;font-size:clamp(1.9rem,3.4vw,2.9rem);line-height:1.12;letter-spacing:-.015em;margin:0 0 .6rem}
.band .band-sub{color:var(--ui-text-muted);max-width:66ch;margin:0 0 2.2rem;font-size:.98rem}
.rule{max-width:1520px;margin:0 auto;padding:0 var(--pad)}
.rule i{display:block;height:1px;background:linear-gradient(to right,var(--ui-border),transparent)}

/* reusable band furniture - documented in references/theme.md */
.ideas{display:grid;grid-template-columns:repeat(auto-fit,minmax(255px,1fr));gap:1px;background:var(--ui-border-quiet);border:1px solid var(--ui-border-quiet);border-radius:12px;overflow:hidden}
.idea{background:var(--ui-canvas-sunken);padding:1.4rem 1.4rem 1.5rem}
.idea .num{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--ui-action);display:block;margin-bottom:.7rem}
.idea h4{font-size:.98rem;font-weight:600;margin:0 0 .5rem;color:var(--ui-text);letter-spacing:-.005em}
.idea p{margin:0;font-size:13.6px;color:var(--ui-text-muted);line-height:1.6}
.idea p code,.idea h4 code{color:var(--ui-text-secondary)}

.tblwrap{border:1px solid var(--ui-border-quiet);border-radius:12px;overflow:hidden;background:var(--ui-canvas-sunken)}
table{width:100%;border-collapse:collapse;font-size:13.8px}
th{text-align:left;font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ui-text-faint);font-weight:500;padding:.85rem 1.1rem;background:var(--ui-canvas-deep);border-bottom:1px solid var(--ui-border)}
td{padding:.85rem 1.1rem;border-bottom:1px solid var(--ui-border-quiet);color:var(--ui-text-muted);vertical-align:top;line-height:1.55}
td:first-child{color:var(--ui-text-secondary)}
td code{color:var(--ctp-lavender);font-size:11.8px}
tr:last-child td{border-bottom:0}
.verdict{font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;white-space:nowrap}
.verdict.good,.verdict.kept{color:var(--ui-success)}
.verdict.warn,.verdict.rev{color:var(--ui-caution)}
.verdict.info,.verdict.add{color:var(--ui-info)}
.verdict.bad,.verdict.fix{color:var(--ui-danger)}

.pair{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:1px;background:var(--ui-border-quiet);border:1px solid var(--ui-border-quiet);border-radius:12px;overflow:hidden;margin-top:1.8rem}
.pair>div{background:var(--ui-canvas-sunken);padding:1.4rem}
.pair h4{font-size:.98rem;font-weight:600;margin:0 0 .6rem;color:var(--ui-text)}
.pair p{margin:0 0 .7rem;font-size:13.8px;color:var(--ui-text-muted);line-height:1.62}
.pair p:last-child{margin-bottom:0}
.pair ul{margin:.3rem 0 0;padding-left:1.1rem;font-size:13.6px;color:var(--ui-text-muted)}
.pair li{margin-bottom:.4rem}
.pair code{color:var(--ctp-lavender);font-size:12.2px}

/* ================= scrolly ================= */
.scrolly{max-width:1520px;margin:0 auto;padding:0 var(--pad);display:grid;grid-template-columns:var(--pane-w) minmax(0,1fr);gap:var(--gap);align-items:start}

.pane{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:1.5rem 0 2rem}
.pane-frame{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--ui-canvas-deep);border:1px solid var(--ui-border);border-radius:14px;overflow:hidden;box-shadow:0 24px 60px -30px rgba(0,0,0,.75)}
.pane-bar{display:flex;align-items:center;gap:.7rem;padding:.7rem .95rem;background:var(--ui-canvas-sunken);border-bottom:1px solid var(--ui-border);flex:none}
.dots{display:flex;gap:.36rem;flex:none}
.dots i{width:9px;height:9px;border-radius:50%}
.dots i:nth-child(1){background:color-mix(in srgb,var(--ctp-red) 70%,var(--ui-canvas-sunken))}
.dots i:nth-child(2){background:color-mix(in srgb,var(--ctp-yellow) 70%,var(--ui-canvas-sunken))}
.dots i:nth-child(3){background:color-mix(in srgb,var(--ctp-green) 70%,var(--ui-canvas-sunken))}
.pane-title{font-family:var(--mono);font-size:11px;color:var(--ui-text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.pane-loc{font-family:var(--mono);font-size:10.5px;color:var(--ui-action);flex:none;padding:.12rem .5rem;border:1px solid color-mix(in srgb,var(--ui-action) 30%,transparent);border-radius:20px;background:color-mix(in srgb,var(--ui-action) 10%,transparent)}
.pane-progress{height:2px;background:var(--ui-border-quiet);flex:none}
.pane-progress i{display:block;height:100%;width:0;background:var(--ui-action);transition:width .25s ease}

.pane-scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:var(--ui-border-strong) transparent}
.pane-scroll::-webkit-scrollbar{width:8px}
.pane-scroll::-webkit-scrollbar-thumb{background:var(--ui-border);border-radius:8px}
.pane-scroll::-webkit-scrollbar-track{background:transparent}

.codefile-head{padding:1.1rem 1.2rem .55rem;border-bottom:1px solid var(--ui-border-quiet);margin-bottom:.7rem}
.codefile+.codefile .codefile-head{margin-top:2.5rem;border-top:1px solid var(--ui-border)}
.codefile-name{display:block;font-family:var(--mono);font-size:11.5px;color:var(--ui-text-secondary);word-break:break-all}
.codefile-sub{display:block;font-family:var(--mono);font-size:10px;color:var(--ui-text-faint);margin-top:.3rem;letter-spacing:.05em}

.pane pre{margin:0;padding:0 0 1.4rem;font-family:var(--mono);font-size:11.5px;line-height:1.78;tab-size:4}
/* Rows are display:block and MUST be emitted with no separator between them -
   a newline inside <pre> is preserved whitespace and renders as a blank line. */
.row{display:block;white-space:pre;padding:.06rem 1.1rem .06rem 0;border-left:2px solid transparent;opacity:.34;transition:opacity .28s ease,background-color .28s ease,border-color .28s ease;cursor:pointer}
.pane-scroll:hover .row{opacity:.82}
/* Hover preview: pointing at any line lights the whole beat block as one unit,
   in the focus colour. Declared before .row.on so the active spotlight wins. */
.row.hov,.pane-scroll:hover .row.hov{opacity:1;background:color-mix(in srgb,var(--ui-focus) 11%,transparent);border-left-color:color-mix(in srgb,var(--ui-focus) 65%,transparent)}
.row.on,.pane-scroll:hover .row.on{opacity:1;background:color-mix(in srgb,var(--ui-action) 9%,transparent);border-left-color:var(--ui-action)}
.row.ctx{cursor:default}
.ln{display:inline-block;width:3.4em;padding-right:1.2em;text-align:right;color:var(--ctp-overlay1);user-select:none;font-size:10px}
.row.hov .ln{color:var(--ui-focus)}
.row.on .ln{color:var(--ui-action)}
.lc{white-space:pre}
@media (prefers-reduced-motion:reduce){.row{transition:none}}

.fold{display:block;padding:.4rem 1.1rem .4rem 3.4em;font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--ui-text-faint);cursor:pointer;border-left:2px solid var(--ui-border-quiet);opacity:.75}
.fold:hover{color:var(--ui-text-muted);border-left-color:var(--ui-border-strong);opacity:1}
.fold::before{content:"\25B8  "}
.fold[aria-expanded="true"]::before{content:"\25BE  "}
.folded[hidden]{display:none}

.k{color:var(--syn-keyword)} .t{color:var(--syn-type)} .f{color:var(--syn-func)}
.s{color:var(--syn-string)}  .q{color:var(--syn-ident)} .n{color:var(--syn-number)}
.p{color:var(--syn-punct)}   .c{color:var(--syn-comment);font-style:italic}
.c.dir{color:var(--ui-quiet-accent);font-style:normal;font-weight:700}

/* ================= narrative ================= */
.story{padding:1.5rem 0 0;max-width:44rem}
.sect{margin:0 0 2rem;padding-top:clamp(4rem,14vh,9rem)}
.story .sect:first-child{padding-top:1.5rem}
.sect h2{font-family:var(--serif);font-weight:300;font-size:clamp(2rem,3.6vw,3.1rem);line-height:1.08;letter-spacing:-.018em;margin:0 0 .55rem;color:var(--ui-text)}
.sect-sub{color:var(--ui-text-muted);margin:0;max-width:52ch;font-size:.97rem}

.beat{position:relative;padding:2.1rem 0 2.4rem;border-top:1px solid var(--ui-border-quiet);min-height:52vh;display:flex;flex-direction:column;justify-content:center;opacity:.42;transition:opacity .35s ease}
/* A rail mirroring the code pane's, so a hovered or active beat reads as the
   same object on both sides. Absolute, so lighting it never shifts the text. */
.beat::before{content:"";position:absolute;left:-1.15rem;top:2.1rem;bottom:2.4rem;width:2px;border-radius:2px;background:transparent;transition:background-color .25s ease}
.beat.hov{opacity:1}
.beat.hov::before{background:color-mix(in srgb,var(--ui-focus) 60%,transparent)}
.beat.on{opacity:1}
.beat.on::before{background:var(--ui-action)}
.beat.hov .beat-range{color:var(--ui-focus);border-color:color-mix(in srgb,var(--ui-focus) 45%,transparent)}
@media (prefers-reduced-motion:reduce){.beat{transition:none;opacity:1}.beat::before{transition:none}}
.sect + .beat{border-top:0}
.beat-meta{display:flex;align-items:center;gap:.6rem;margin-bottom:.85rem;flex-wrap:wrap}
.beat-range{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--ui-text-faint);border:1px solid var(--ui-border);border-radius:20px;padding:.15rem .6rem;transition:color .3s ease,border-color .3s ease}
.beat.on .beat-range{color:var(--ui-action);border-color:color-mix(in srgb,var(--ui-action) 45%,transparent)}
.beat-file{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ui-quiet-accent)}
.beat h3{font-size:1.28rem;font-weight:600;letter-spacing:-.014em;margin:0 0 .85rem;color:var(--ui-text);line-height:1.28}
.beat h3 code{font-size:.9em;color:var(--ui-text)}
.beat p{margin:0 0 .95rem;color:var(--ui-text-secondary);font-size:15px;line-height:1.68}
.beat p:last-child{margin-bottom:0}
.beat strong{color:var(--ui-text);font-weight:600}
.beat em{color:var(--ui-text-secondary)}
.beat code{background:color-mix(in srgb,var(--ui-panel) 70%,transparent);color:var(--ctp-lavender);padding:.1em .38em;border-radius:4px;font-size:12.6px}
.beat ul,.beat ol{margin:.3rem 0 1rem;padding-left:1.15rem;color:var(--ui-text-secondary);font-size:14.6px}
.beat li{margin-bottom:.42rem}
.beat li::marker{color:var(--ui-text-faint)}

.tags{display:flex;flex-wrap:wrap;gap:.4rem;margin:0 0 .95rem}
.tag{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;padding:.25em .6em;border-radius:4px;border:1px solid;white-space:nowrap}
.tag.adr,.tag.info    {color:var(--ui-info);        border-color:color-mix(in srgb,var(--ui-info) 38%,transparent);        background:color-mix(in srgb,var(--ui-info) 10%,transparent)}
.tag.dev,.tag.caution {color:var(--ui-caution);     border-color:color-mix(in srgb,var(--ui-caution) 38%,transparent);     background:color-mix(in srgb,var(--ui-caution) 10%,transparent)}
.tag.trap,.tag.danger {color:var(--ui-danger);      border-color:color-mix(in srgb,var(--ui-danger) 38%,transparent);      background:color-mix(in srgb,var(--ui-danger) 10%,transparent)}
.tag.authz,.tag.accent{color:var(--ui-quiet-accent);border-color:color-mix(in srgb,var(--ui-quiet-accent) 38%,transparent);background:color-mix(in srgb,var(--ui-quiet-accent) 10%,transparent)}
.tag.perf,.tag.good   {color:var(--ui-success);     border-color:color-mix(in srgb,var(--ui-success) 38%,transparent);     background:color-mix(in srgb,var(--ui-success) 10%,transparent)}
.tag.audit,.tag.quiet {color:var(--ui-text-muted);  border-color:var(--ui-border);                                         background:color-mix(in srgb,var(--ui-panel) 45%,transparent)}

.note{border-left:2px solid var(--ui-border-strong);padding:.5rem 0 .5rem 1rem;margin:1rem 0;font-size:13.8px;color:var(--ui-text-muted);line-height:1.62}
.note b{color:var(--ui-text-secondary);font-weight:600}
.note code{font-size:12.2px}
.note.trap,.note.danger{border-left-color:var(--ui-danger)}
.note.trap b,.note.danger b{color:var(--ui-danger)}
.note.dev,.note.caution{border-left-color:var(--ui-caution)}
.note.dev b,.note.caution b{color:var(--ui-caution)}
.note.perf,.note.good{border-left-color:var(--ui-success)}
.note.perf b,.note.good b{color:var(--ui-success)}
.note.info{border-left-color:var(--ui-info)}
.note.info b{color:var(--ui-info)}

/* ================= chapter rail ================= */
.rail{position:fixed;left:calc(var(--pad) * .34);top:50%;transform:translateY(-50%);z-index:5;display:flex;flex-direction:column;gap:.1rem}
.rail a{border:0;font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ui-text-faint);padding:.34rem 0 .34rem .7rem;border-left:2px solid var(--ui-border);white-space:nowrap;max-width:0;overflow:hidden;opacity:.55;transition:max-width .3s ease,opacity .3s ease,color .3s ease,border-color .3s ease}
.rail:hover a{max-width:16rem;opacity:1}
.rail a.on{color:var(--ui-action);border-left-color:var(--ui-action);opacity:1;max-width:16rem}
.rail:empty{display:none}
@media(max-width:1500px){.rail{display:none}}

footer{max-width:1520px;margin:0 auto;padding:3rem var(--pad) 6rem;border-top:1px solid var(--ui-border-quiet)}
footer p{max-width:78ch;color:var(--ui-text-faint);font-size:13px;margin:0}
footer code{color:var(--ui-text-muted)}

@media(max-width:1080px){
  .scrolly{grid-template-columns:1fr;gap:0}
  .pane{height:auto;top:0;padding:0;z-index:4}
  .pane-frame{height:46vh;border-radius:0 0 14px 14px;border-top:0}
  .story{max-width:none;padding-top:2rem}
  .beat{min-height:auto}
}
</style>
</head>
<body>

<div class="rail">{{RAIL}}</div>

<header class="mast">
 <div class="mast-inner">
  <div class="eyebrow">{{EYEBROW}}</div>
  <h1>{{TITLE}}</h1>
  <p class="lede">{{LEDE}}</p>
  {{FACTS}}
 </div>
</header>

{{INTRO}}

<div class="scrolly">
  <div class="pane">
    <div class="pane-frame">
      <div class="pane-bar">
        <div class="dots"><i></i><i></i><i></i></div>
        <div class="pane-title" id="paneTitle">{{FIRSTFILE}}</div>
        <div class="pane-loc" id="paneLoc">&nbsp;</div>
      </div>
      <div class="pane-progress"><i id="paneProgress"></i></div>
      <div class="pane-scroll" id="paneScroll">{{PANE}}</div>
    </div>
  </div>
  <div class="story">{{NARRATIVE}}</div>
</div>

{{OUTRO}}

<footer><p>{{FOOTER}}</p></footer>

<script id="langdefs" type="application/json">{{LANGS}}</script>
<script id="filenames" type="application/json">{{FILENAMES}}</script>
<script>
(function(){
  "use strict";
  var LANGS = JSON.parse(document.getElementById("langdefs").textContent);
  var FILES = JSON.parse(document.getElementById("filenames").textContent);

  function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
  function setOf(arr){ var o = Object.create(null); (arr||[]).forEach(function(w){ o[w] = 1; }); return o; }

  var CACHE = {};
  function langOf(id){
    if(CACHE[id]) return CACHE[id];
    var raw = LANGS[id] || LANGS.plain || {};
    CACHE[id] = {
      line: raw.line || null,
      blockOpen: raw.block ? raw.block[0] : null,
      blockClose: raw.block ? raw.block[1] : null,
      strings: raw.strings || [],
      idents: raw.idents || [],
      ci: !!raw.ci,
      kw: setOf(raw.keywords), ty: setOf(raw.types), fn: setOf(raw.funcs),
      directive: raw.directive ? new RegExp(raw.directive) : null
    };
    return CACHE[id];
  }

  /* One tokenizer, per-language tables. Block-comment state is carried across
     lines by the caller so a multi-line comment stays one colour. */
  function highlight(line, L, state){
    var out = "", i = 0;
    if(state.inBlock){
      var end = L.blockClose ? line.indexOf(L.blockClose) : -1;
      if(end === -1) return { html: '<span class="c">' + esc(line) + "</span>", state: state };
      out += '<span class="c">' + esc(line.slice(0, end + L.blockClose.length)) + "</span>";
      i = end + L.blockClose.length; state.inBlock = false;
    }
    while(i < line.length){
      var rest = line.slice(i), c = line[i], j, m;
      if(L.line && rest.indexOf(L.line) === 0){
        var cls = (L.directive && L.directive.test(rest)) ? "c dir" : "c";
        out += '<span class="' + cls + '">' + esc(rest) + "</span>";
        return { html: out, state: state };
      }
      if(L.blockOpen && rest.indexOf(L.blockOpen) === 0){
        var e = line.indexOf(L.blockClose, i + L.blockOpen.length);
        if(e === -1){ out += '<span class="c">' + esc(rest) + "</span>"; state.inBlock = true; return { html: out, state: state }; }
        out += '<span class="c">' + esc(line.slice(i, e + L.blockClose.length)) + "</span>";
        i = e + L.blockClose.length; continue;
      }
      if(L.strings.indexOf(c) >= 0){
        j = i + 1;
        while(j < line.length){ if(line[j] === "\\"){ j += 2; continue; } if(line[j] === c) break; j++; }
        out += '<span class="s">' + esc(line.slice(i, Math.min(j + 1, line.length))) + "</span>";
        i = j + 1; continue;
      }
      if(L.idents.indexOf(c) >= 0){
        j = i + 1; while(j < line.length && line[j] !== c) j++;
        out += '<span class="q">' + esc(line.slice(i, j + 1)) + "</span>";
        i = j + 1; continue;
      }
      m = /^[A-Za-z_$][A-Za-z0-9_$]*/.exec(rest);
      if(m){
        var w = m[0], key = L.ci ? w.toUpperCase() : w;
        var k = (L.fn[w] || L.fn[key]) ? "f" : (L.kw[key] ? "k" : (L.ty[key] ? "t" : ""));
        out += k ? '<span class="' + k + '">' + esc(w) + "</span>" : esc(w);
        i += w.length; continue;
      }
      m = /^\d[\d_]*(\.\d+)?([eE][-+]?\d+)?/.exec(rest);
      if(m){ out += '<span class="n">' + esc(m[0]) + "</span>"; i += m[0].length; continue; }
      if("(){}[],;:=<>+*/&|!?.-".indexOf(c) >= 0){ out += '<span class="p">' + esc(c) + "</span>"; i++; continue; }
      out += esc(c); i++;
    }
    return { html: out, state: state };
  }

  /* ---- 1. highlight the pane in place, per file, preserving block state ---- */
  [].slice.call(document.querySelectorAll(".codefile")).forEach(function(fileEl){
    var L = langOf(fileEl.dataset.lang || "plain"), state = { inBlock: false };
    [].slice.call(fileEl.querySelectorAll(".row .lc")).forEach(function(lc){
      var r = highlight(lc.textContent, L, state);
      lc.innerHTML = r.html; state = r.state;
    });
  });

  var rows = [].slice.call(document.querySelectorAll(".pane-scroll .row"));
  var byKey = {};
  rows.forEach(function(r){ byKey[r.dataset.f + ":" + r.dataset.n] = r; });

  var beats = [].slice.call(document.querySelectorAll(".beat"));
  var railLinks = [].slice.call(document.querySelectorAll(".rail a"));
  var scroller = document.getElementById("paneScroll");
  var paneTitle = document.getElementById("paneTitle");
  var paneLoc = document.getElementById("paneLoc");
  var paneProgress = document.getElementById("paneProgress");

  /* ---- 2. collapsed context runs ---- */
  [].slice.call(document.querySelectorAll(".fold")).forEach(function(f){
    f.setAttribute("role", "button");
    f.setAttribute("tabindex", "0");
    f.setAttribute("aria-expanded", "false");
    function toggle(){
      var body = f.nextElementSibling, open = f.getAttribute("aria-expanded") === "true";
      body.hidden = open;
      f.setAttribute("aria-expanded", open ? "false" : "true");
    }
    f.addEventListener("click", toggle);
    f.addEventListener("keydown", function(e){ if(e.key === "Enter" || e.key === " "){ e.preventDefault(); toggle(); } });
  });

  function forRange(beat, fn){
    var f = beat.dataset.file, from = +beat.dataset.from, to = +beat.dataset.to;
    for(var n = from; n <= to; n++){
      var r = byKey[f + ":" + n];
      if(r) fn(r, n === from, n === to);
    }
  }

  /* ---- 3. link the two columns: click to jump, hover to preview ---- */
  var lineToBeat = {};
  beats.forEach(function(b){
    var f = b.dataset.file, from = +b.dataset.from, to = +b.dataset.to;
    for(var n = from; n <= to; n++){ if(!lineToBeat[f + ":" + n]) lineToBeat[f + ":" + n] = b; }
  });
  var beatOf = function(row){ return lineToBeat[row.dataset.f + ":" + row.dataset.n] || null; };

  rows.forEach(function(r){
    var b = beatOf(r);
    if(!b){ r.classList.add("ctx"); return; }
    r.addEventListener("click", function(){ b.scrollIntoView({ block: "center", behavior: "smooth" }); });
  });

  /* Hovering anywhere in a beat's range lights the whole block on both sides,
     so the code and its explanation read as one linked object. Pointer-only:
     on touch, mouseover fires on tap and would leave the state stuck on. */
  if(window.matchMedia("(hover: hover)").matches){
    var hovered = null;
    function setHover(beat){
      if(beat === hovered) return;
      if(hovered){
        hovered.classList.remove("hov");
        forRange(hovered, function(r){ r.classList.remove("hov"); });
      }
      hovered = beat;
      if(beat){
        beat.classList.add("hov");
        forRange(beat, function(r){ r.classList.add("hov"); });
      }
    }
    scroller.addEventListener("mouseover", function(e){
      var row = e.target.closest ? e.target.closest(".row") : null;
      setHover(row ? beatOf(row) : null);
    });
    scroller.addEventListener("mouseleave", function(){ setHover(null); });
    beats.forEach(function(b){
      b.addEventListener("mouseenter", function(){ setHover(b); });
      b.addEventListener("mouseleave", function(){ setHover(null); });
    });
  }

  /* ---- 4. drive the spotlight from scroll position ---- */
  if(!beats.length) return;
  var current = null;
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function activate(beat){
    if(beat === current) return;
    if(current){ current.classList.remove("on"); forRange(current, function(r){ r.classList.remove("on"); }); }
    current = beat;
    beat.classList.add("on");

    var first = null, last = null;
    forRange(beat, function(r, isFirst, isLast){
      r.classList.add("on");
      if(isFirst) first = r;
      if(isLast) last = r;
      /* a spotlit line inside a collapsed run forces that run open */
      var host = r.closest(".folded");
      if(host && host.hidden){ host.hidden = false; host.previousElementSibling.setAttribute("aria-expanded", "true"); }
    });

    paneTitle.textContent = FILES[beat.dataset.file] || "";
    var from = beat.dataset.from, to = beat.dataset.to;
    paneLoc.textContent = from === to ? "L" + from : "L" + from + "–" + to;

    if(first && last){
      var top = first.offsetTop, bottom = last.offsetTop + last.offsetHeight;
      var target = top + (bottom - top) / 2 - scroller.clientHeight / 2;
      var max = scroller.scrollHeight - scroller.clientHeight;
      scroller.scrollTo({ top: Math.max(0, Math.min(target, max)), behavior: reduce ? "auto" : "smooth" });
    }

    paneProgress.style.width = ((+beat.dataset.i + 1) / beats.length * 100) + "%";

    var chapter = null;
    for(var i = 0; i < beats.length; i++){
      var prev = beats[i].previousElementSibling;
      if(prev && prev.classList.contains("sect")) chapter = beats[i].id;
      if(beats[i] === beat) break;
    }
    railLinks.forEach(function(a){ a.classList.toggle("on", a.dataset.beat === chapter); });
  }

  var ticking = false;
  function onScroll(){
    if(ticking) return;
    ticking = true;
    requestAnimationFrame(function(){
      ticking = false;
      var line = window.innerHeight * 0.45, pick = null;
      for(var i = 0; i < beats.length; i++){
        if(beats[i].getBoundingClientRect().top <= line) pick = beats[i]; else break;
      }
      if(!pick && beats[0].getBoundingClientRect().top < window.innerHeight) pick = beats[0];
      if(pick) activate(pick);
    });
  }
  window.addEventListener("scroll", onScroll, { passive: true });
  window.addEventListener("resize", onScroll, { passive: true });
  onScroll();
})();
</script>
</body>
</html>
