[install]
# Only resolve package versions that have been published for at least 5 days.
minimumReleaseAge = 432000
# Use flat hoisting (not the isolated .bun store) so the workspace member
# resolves transitive deps the app imports directly, matching the pre-monorepo layout.
linker = "hoisted"

[test]
# Claude Code mod tests run under `claude plugin test`, not bun.
# The coordinate Herdr mods run their own suite with a renderer preload (plugins/coordinate/herdr).
pathIgnorePatterns = ["plugins/*/tests/**", "plugins/coordinate/**"]
preload = ["./test-setup.ts"]
