name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    # A healthy run takes about 3 minutes. Cap hung runs instead of letting
    # them burn GitHub's 6 hour default.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # The em dash and new lint warning checks diff against the base commit.
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      # verify installs both dependency trees (root and plugins/coordinate/herdr)
      # with --frozen-lockfile, then runs every check; see scripts/verify.ts.
      - name: Verify
        run: bun run verify
        env:
          VERIFY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
